name: Publish NuGet package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Analyzer.Tests/Analyzer.Tests.csproj --configuration Release

      - name: Pack
        shell: bash
        env:
          PACKAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          version="${PACKAGE_TAG#v}"
          dotnet pack Analyzer/Analyzer.csproj \
            --configuration Release \
            --no-restore \
            -p:PackageVersion="$version" \
            -p:RepositoryUrl="https://github.com/$GITHUB_REPOSITORY" \
            -p:PublishRepositoryUrl=true \
            --output ./artifacts

      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/$owner/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

      - name: Make package public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package="RoslynArchitectureGuidelines"
          owner_type="$(gh api "/users/$owner" --jq '.type')"
          if [[ "$owner_type" == "Organization" ]]; then
            endpoint="/orgs/$owner/packages/nuget/$package/visibility"
            package_list="/orgs/$owner/packages?package_type=nuget&per_page=100"
          else
            endpoint="/user/packages/nuget/$package/visibility"
            package_list="/user/packages?package_type=nuget&per_page=100"
          fi
          visibility="$(gh api "$package_list" --jq --arg name "$package" '[.[] | select(.name == $name)] | first | .visibility // empty')"
          if [[ "$visibility" == "public" ]]; then
            echo "Package is already public."
          elif [[ "$visibility" == "private" ]]; then
            gh api --method PATCH "$endpoint" -f visibility=public
          else
            echo "Could not find package '$package' in GitHub Packages." >&2
            exit 1
          fi
